Update-Leaderboard-Every-Minutes: 15
Default-Kit: NONE
Date-Format: dd/MM/yyyy
Broadcast-Time: [60, 30, 15, 5, 4, 3, 2, 1]
Allowed-Commands: [sw, skywars, tell, help, r, msg, menu, hub, minigames, mv, m, music, scoreboard, sit, gsit, salir, pgplay, pgleave, partygames, pg]


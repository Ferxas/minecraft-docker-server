services:

  mc-init:
    image: alpine:3.21
    container_name: mc-init
    restart: "no"
    volumes:
      - ./server-data:/data
      - ./plugin-configs:/bootstrap/plugin-configs:ro
      - ./skript:/bootstrap/skript:ro
      - ./plugins:/bootstrap/plugins:ro
      - ./worlds:/bootstrap/worlds:ro
      - ./configs:/bootstrap/configs:ro
      - ./bootstrap:/bootstrap/extras:ro
      - ./scripts/mc-init.sh:/init/mc-init.sh:ro
    entrypoint: ["/bin/sh", "/init/mc-init.sh"]

  mysql:
    image: mysql:8.0
    container_name: mc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: minecraft
      MYSQL_USER: discordsrv
      MYSQL_PASSWORD: discordsrvpass
    volumes:
      # Named volume (WSL2 ext4) — required on Windows. Bind-mounting ./mysql-data
      # onto NTFS forces lower_case_table_names=2 and crashes DBs initialized with 0.
      - mc-mysql-data:/var/lib/mysql
    # Only DiscordSRV uses MySQL (via the internal "mysql" hostname). Bind to
    # loopback so the weak default credentials are not reachable from the LAN.
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  minecraft:
    build:
      context: ./docker/mc-jcef
      dockerfile: Dockerfile
    image: mc-paper-jcef:1.21.11
    container_name: mc
    restart: unless-stopped
    depends_on:
      mc-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    ports:
      - "25565:25565"
      - "8804:8804"
      - "8100:8100"
      # Bedrock UDP: use Windows Geyser Standalone (tools/switch-bedrock), not Docker publish.
      # WSL2 UDP publish does not reach LAN clients reliably.
    environment:
      EULA: "TRUE"
      ONLINE_MODE: "FALSE"
      ENABLE_AUTOPAUSE: "FALSE"
      ENABLE_COMMAND_BLOCK: "FALSE"
      TYPE: "PAPER"
      VERSION: "1.21.11"
      MEMORY: 8G
      # Tuned G1 GC flags (shorter GC pauses / fewer lag spikes on an 8G heap)
      USE_AIKAR_FLAGS: "true"
      UID: "1000"
      GID: "1000"
      # Help JCEF find libjawt.so from Temurin
      LD_LIBRARY_PATH: "/opt/java/openjdk/lib:/opt/java/openjdk/lib/server"
      # JogAmp/JCEF need an X11 display even for off-screen rendering
      DISPLAY: ":99"
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: "llvmpipe"
      vblank_mode: "0"
      # Interpose broken Mesa glXQueryDrawable (null dri2 under Xvfb/dummy edge cases)
      LD_PRELOAD: "/usr/local/lib/libglx_query_shim.so"
      # JOGL OSR on JDK 16+ needs these; also keep NoSetSwapInterval* as soft preference
      JVM_OPTS: >-
        -Djogl.quirks.force=NoSetSwapInterval,NoSetSwapIntervalPostRetarget
        --add-exports=java.base/java.lang=ALL-UNNAMED
        --add-exports=java.desktop/sun.awt=ALL-UNNAMED
        --add-exports=java.desktop/sun.java2d=ALL-UNNAMED
    volumes:
      - ./server-data:/data
    # Flush and freeze world saves while volume-backup archives /data, so region
    # files are never captured half-written.
    labels:
      docker-volume-backup.archive-pre: /bin/sh -c "rcon-cli 'save-all flush' && rcon-cli save-off"
      docker-volume-backup.archive-post: rcon-cli save-on
    # Chromium/JCEF (MapBrowser) needs shared memory; default Docker 64MB is too small.
    shm_size: "1gb"
    # Native JogAmp crashes were dumping 12GB cores into /data — never again
    ulimits:
      core: 0

    stdin_open: true
    tty: true
    # Heavy plugin stack; Paper may take 10–15+ min before status ping succeeds.
    healthcheck:
      test: ["CMD", "mc-monitor", "status", "--host", "localhost", "--port", "25565"]
      interval: 30s
      timeout: 15s
      retries: 20
      start_period: 1200s

  volume-backup:
    image: offen/docker-volume-backup:latest
    container_name: mc-backup
    restart: unless-stopped
    depends_on:
      mc-init:
        condition: service_completed_successfully
    environment:
      BACKUP_CRON_EXPRESSION: "0 3 * * *"
      BACKUP_RETENTION_DAYS: "7"
      # Timestamped names so retention actually keeps 7 days (a fixed name
      # overwrote the single archive every night).
      BACKUP_FILENAME: mc-backup-%Y-%m-%dT%H-%M-%S.tar.gz
      BACKUP_PRUNING_PREFIX: mc-backup-
      # Skip regenerable / redundant data: AutoBackup zips, logs, caches, BlueMap
      # renders, and spark's temp files (which vanish mid-archive and abort the run).
      BACKUP_EXCLUDE_REGEXP: ^/backup/minecraft-data/(backups|logs|cache|crash-reports|bluemap|plugins/spark)(/|$)
      TZ: America/Bogota
    volumes:
      - ./server-data:/backup/minecraft-data:ro
      - mc-mysql-data:/backup/mysql-data:ro
      - ./mc-backups:/archive
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  mc-mysql-data:
    name: mc-compose_mc-mysql-data
    external: true

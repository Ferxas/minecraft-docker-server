# GrimAC — castigos para Con Los Pibes (servidor de minijuegos, modo offline + Geyser).
# Criterio:
#  - Movimiento: Grim ya hace "setback" (devuelve al jugador a la última posición legal), así que
#    solo se avisa al staff. Mecánicas de plugins (paracaídas/vehículos de BRX, doble salto de TNTRun,
#    GSit, morphs) pueden dar falsos positivos: un setback no molesta, una expulsión sí.
#  - Combate (Reach/Hitboxes): checks muy fiables -> aviso temprano y expulsión con muchas violaciones.
#  - Paquetes imposibles / crash: expulsión.
# Formato "N:M comando": se ejecuta al llegar a N violaciones activas y luego cada M (M=0: una vez).
# [alert] = aviso a quien tenga grim.alerts (grupos admin y moderador). [log] = registro en GrimAC.

Punishments:
  Simulation:
    remove-violations-after: 300
    checks:
      - "Simulation"
      - "GroundSpoof"
      - "Timer"
      - "TimerLimit"
      - "NoFall"
    commands:
      - "100:50 [alert]"
      - "1:1 [log]"
  Knockback:
    remove-violations-after: 300
    checks:
      - "Knockback"
      - "Explosion"
    commands:
      - "8:8 [alert]"
      - "1:1 [log]"
  Post:
    remove-violations-after: 300
    checks:
      - "Post"
    commands:
      - "20:20 [alert]"
      - "1:1 [log]"
  BadPackets:
    remove-violations-after: 300
    checks:
      - "BadPackets"
      - "PacketOrder"
    commands:
      - "20:20 [alert]"
      - "1:1 [log]"
      - "60:0 kick %player% &cConexión inválida detectada. Si es un error, vuelve a entrar."
  Crash:
    remove-violations-after: 300
    checks:
      - "Crash"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "3:0 kick %player% &cPaquetes inválidos detectados."
  Reach:
    remove-violations-after: 300
    checks:
      - "Reach"
    commands:
      - "3:3 [alert]"
      - "1:1 [log]"
      - "15:0 kick %player% &cAlcance de golpe imposible detectado (anticheat)."
  Hitboxes:
    remove-violations-after: 300
    checks:
      - "Hitboxes"
    commands:
      - "5:5 [alert]"
      - "1:1 [log]"
      - "25:0 kick %player% &cGolpes fuera del cuerpo del rival detectados (anticheat)."
  Misc:
    remove-violations-after: 300
    checks:
      - "Vehicle"
      - "NoSlow"
      - "Sprint"
      - "MultiActions"
      - "Place"
      - "Baritone"
      - "Break"
      - "TransactionOrder"
      - "Elytra"
      - "Chat"
      - "Exploit"
    commands:
      - "15:10 [alert]"
      - "1:1 [log]"
  Combat:
    remove-violations-after: 300
    checks:
      - "Interact"
      - "Aim"
    commands:
      - "20:40 [alert]"
      - "1:1 [log]"
  Autoclicker:
    remove-violations-after: 300
    checks:
      - "Autoclicker"
    commands:
      - "20:40 [alert]"
      - "1:1 [log]"

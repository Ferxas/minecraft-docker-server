# --------------------------------------------------- #
#             MapBrowser Configuration                #
# --------------------------------------------------- #

jcef:
  # Your custom JCEF binaries path (leave blank to disable)
  # Default: (plguins)/MapBrowser/jcef-bundle
  custom-install-path: ""
  # Custom jcef-maven download mirror (for custom-builds)
  mirror: "https://github.com/Steve3184/mb_jcefbuild/releases/download/v1/"
  # Should jcef-maven check the JCEF binaries at startup?
  skip-download: false

browser:
  # Should we enable the sound (default is false)
  enable-sound: false
  # CEF's user data directory
  # Default: (plugins)/MapBrowser/userdata
  user-data-dir: "userdata"
  # CEF's remote debugging
  remote-debugging:
    enabled: false
    # Should we enable it? (default is false)
    port: 9222
    # Remote Debugging Port (default is 9222)
  # CEF's User-Agent
  user-agent: ""
  # Where should CEF output the log
  # 'file' -> write to (plugins)/MapBrowser/cef.log
  # 'console' -> write to console
  chrome-log-output: "file"
  # Extra CEF startup args
  custom-chrome-args:
    - "--disable-gpu-compositing"
    - "--disable-gpu-vsync"
# --------------------------------------------------- #
#        Comodidad (fork del servidor, en español)    #
# --------------------------------------------------- #

# Distancia (bloques) a la que los jugadores ven las pantallas y pueden usarlas con /mb.
view-distance: 32
# Muestra los controles en la barra de acción al acercarse a una pantalla (una vez cada 10 min).
show-hints: true

# Valores de /mb crear (mirando a una pared).
defaults:
  url: "https://www.google.com"
  width: 3
  height: 2
  # Tamaño máximo para quien no tenga mapbrowser.admin. Con renderizado por software, más de 4x3 va lento.
  max-width: 6
  max-height: 4

controls:
  # Píxeles que baja/sube cada clic derecho / Shift+clic derecho.
  scroll-pixels: 300
  # En /mb escribir, cada mensaje del chat pulsa Enter al final (empieza el mensaje con + para no pulsarlo).
  chat-presses-enter: true
  # Segundos sin escribir hasta salir solo del modo escribir.
  typing-timeout-seconds: 120

# Fila de favoritos del menú (Shift + clic izquierdo en la pantalla). Máximo 9.
# icon = material de Minecraft. name admite colores con &.
favorites:
  - name: "&cYouTube"
    icon: RED_WOOL
    url: "https://www.youtube.com"
  - name: "&fGoogle"
    icon: COMPASS
    url: "https://www.google.com"
  - name: "&fWikipedia"
    icon: BOOK
    url: "https://es.wikipedia.org"
  - name: "&bMapa del servidor"
    icon: FILLED_MAP
    url: "http://localhost:8100"
  - name: "&eTiempo"
    icon: SUNFLOWER
    url: "https://wttr.in/?lang=es"

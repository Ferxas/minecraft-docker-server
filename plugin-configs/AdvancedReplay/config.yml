general:
  max_length: 3600
  record_on_startup: false
  save_on_stop: true
  use_mysql: false
  use_s3: false
  use_offline_skins: true
  quality: high
  cleanup_replays: -1
  hide_players: false
  add_new_players: false
  update_notifications: false
replaying:
  use_modern_pause: true
  world:
    reset_changes: false
  progress_display: action_bar
recording:
  blocks:
    enabled: true
    real_changes: true
  entities:
    enabled: true
    items:
      enabled: true
  chat:
    enabled: true
    format: '&r<{name}> {message}'

# AymanIsam HungerGames 1.9.0 — https://hungergames.aymanisam.me/docs/introduction
# whitelist-worlds: true -> SOLO los mundos de la lista son arenas HG (antes HG trataba como arena
# cualquier mundo no listado: PartyGames, BattleRoyale*, skywars1... y aplicaba sus reglas allí).
lobby-world: SakuraSpawn
default-language: es_es
# Los tips de HG se envían a TODOS los jugadores online — desactivados fuera de partidas HG
tips: false
whitelist-worlds: true
ignored-worlds:
- HGPlay
- hg_breeze
- hg_howling
# true = al morir pasas a espectador en HGPlay hasta que acabe la partida.
# Skript hg-leave-item.sk da barrier para salir con /hg lobby (clic o agacharse 2x).
# NO usar hg-gamerules force-respawn con spectating: true (rompe el espectador).
spectating: true
reset-world: false
custom-teams: false
database:
  enabled: true
  url: jdbc:mysql://mysql:3306/hungergames?autoReconnect=true
  user: discordsrv
  password: discordsrvpass
  interval: 60

      slot: 1
    Shop:
      enabled: true
      slot: 2
    Party:
      enabled: true
      slot: 3
    Profile:
      enabled: true
      slot: 5
    Boosters:
      enabled: true
      slot: 6
    Quit:
      enabled: true
      slot: 9

# Normal-Mode-Kits Format: 'Slot: Kit Name'
# Loadouts format: 'Item :: Points cost'
# You can also add items from other plugins. Read chests.yml for further documentation on format

Normal-Mode-Kits:
  '&cKits #1':
    '10': Griefer
    '11': Miner
    '12': Armorer
    '13': Trainer
    '14': Tactician
    '15': Hunter
    '16': Necromancer
    '19': Enchanter
    '20': Armorer+
    '21': Hunter+
    '22': Lumberjack
    '23': Blaze
    '24': Knight

